versioning:
  scheme: standard-version
  detail: >-
    Versioning follows the HL7 FHIR release train rather than a vendor version. The version identifier is
    the FHIR release in the path — /r4/ and, historically, /dstu2/ — and the CapabilityStatement reports
    fhirVersion 4.0.1. There is no vendor-specific version header, date-pinning or version query parameter.
  current: R4 (FHIR 4.0.1)
  in_path: true
  docs: https://docs.oracle.com/en/industries/health/millennium-platform-apis/mfrap/index.html
deprecation:
  policy_url: https://docs.oracle.com/en/industries/health/millennium-platform-apis/apis.html
  sunset_header: false
  deprecation_header: false
  formal_policy: false
  detail: >-
    Oracle Health publishes deprecation ANNOUNCEMENTS but not a deprecation POLICY. There is no stated
    notice period, no support window, no Sunset or Deprecation response header, and no machine-readable
    signal of any kind on a deprecated endpoint. The one live deprecation is announced in prose on the
    APIs index page, and the announcement that carries the actual dates is on the Oracle Health Developer
    Forums, which returns 403 to an anonymous client.
  announcements:
    - subject: FHIR DSTU 2 APIs
      status: end-of-support
      statement: >-
        "Oracle no longer supports DSTU 2 FHIR APIs. For more information, see the FHIR DSTU2 End of
        Support announcement on the Oracle Health Developer Forums. This functionality is replaced by the
        R4 version. Update your applications to use R4 as soon as possible to prevent interruptions to
        service."
      source: https://docs.oracle.com/en/industries/health/millennium-platform-apis/apis.html
      end_of_life_date: null
      note: >-
        No date is published on any anonymously readable page. The DSTU 2 reference documentation is still
        served, which is the confusing part: the docs are live, the support is not.
    - subject: Proprietary (non-FHIR) Millennium APIs
      status: at-risk
      statement: >-
        As the platform moves toward Oracle Health Cloud, proprietary APIs may be deprecated,
        restructured or replaced.
      end_of_life_date: null
deprecated_operations:
  - spec: openapi/cerner-millennium-fhir-r4-openapi.yml
    operations: []
    note: >-
      No operation in the R4 CapabilityStatement carries a deprecation marker. The deprecation in force is
      at the API-family level (all of DSTU 2), which FHIR conformance has no way to express.
status_page:
  url: null
  detail: >-
    No status page for the Oracle Health Millennium Platform APIs. https://www.oracle.com/health/status/
    returns 404 and status.oracle.com does not resolve. Oracle operates https://ocistatus.oraclecloud.com/
    for Oracle Cloud Infrastructure, but it does not cover the Millennium FHIR endpoints, so it is NOT
    recorded here as this API's status page. Health-system customers get availability information through
    their Oracle Health account channel instead.
  probed:
    - url: https://www.oracle.com/health/status/
      status: 404
    - url: https://status.oracle.com/
      status: 0
      note: does not resolve
    - url: https://ocistatus.oraclecloud.com/
      status: 200
      note: OCI-wide, not Oracle Health Millennium — not this API's status page.
sla:
  url: null
  uptime_target: null
  detail: >-
    No public SLA. Availability commitments are contractual between Oracle Health and the health system
    that operates the tenant; an app developer integrating against a customer's tenant inherits that
    customer's contract and has no first-party SLA of their own.
support:

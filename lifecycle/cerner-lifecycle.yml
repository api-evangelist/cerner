domain_migration:
  detail: >-
    The Cerner-branded developer estate has been folded into Oracle. fhir.cerner.com now 301s to
    docs.oracle.com/en/industries/health/, and code.cerner.com — the Cerner Code Console — 301s to
    www.oracle.com/health/developer/. The API HOSTS have not moved: fhir-ehr.cerner.com,
    fhir-ehr-code.cerner.com, fhir-myrecord.cerner.com, fhir-open.cerner.com and authorization.cerner.com
    all still serve live traffic on cerner.com. Documentation migrated; the runtime did not.

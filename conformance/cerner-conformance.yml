standards:
  - id: fhir-r4
    name: HL7 FHIR R4 (4.0.1)
    conforms: true
    evidence: >-
      CapabilityStatement.fhirVersion = 4.0.1, status = active, publisher = Oracle Health, kind =
      instance. 44 resource types with declared interactions; wire format application/fhir+json.
  - id: fhir-rest-api
    name: FHIR RESTful API (read / search-type / create / update / patch / delete / batch)
    conforms: true
    evidence: >-
      CapabilityStatement.rest.resource declares read on 42 types, search-type on 37, create on 19,
      patch on 8, update on 7, delete on 1; rest.interaction declares system-level batch
      ("Implemented per the specification").
  - id: fhir-bulk-data-access
    name: HL7 FHIR Bulk Data Access (Flat FHIR) IG
    conforms: true
    evidence: >-
      CapabilityStatement.instantiates includes
      http://hl7.org/fhir/uv/bulkdata/CapabilityStatement/bulk-data, and Group declares the named
      operation $export (OperationDefinition
      https://fhir-ehr.cerner.com/r4/OperationDefinition/group-export). Published REST endpoints
      /Group/{id}/$export, POST /Patient/$export, /bulk-export/jobs/{id}, /bulk-export/files/{id} —
      https://docs.oracle.com/en/industries/health/millennium-platform-apis/mfbda/rest-endpoints.html
  - id: smart-app-launch
    name: SMART App Launch (SMART on FHIR)
    conforms: true
    evidence: >-
      /.well-known/smart-configuration served at the tenant service root; CapabilityStatement.rest.security
      declares service code SMART-on-FHIR and the SMART oauth-uris extension
      (http://fhir-registry.smarthealthit.org/StructureDefinition/oauth-uris). Advertised capabilities
      include launch-ehr, launch-standalone, context-ehr-patient, context-ehr-encounter, context-banner,
      context-style.
  - id: smart-app-launch-v2
    name: SMART App Launch 2.0 granular scopes
    conforms: true
    evidence: >-
      smart-configuration capabilities include BOTH permission-v1 and permission-v2; the advertised scope
      set carries v2 granular forms (e.g. patient/AllergyIntolerance.crus, patient/Account.rs) alongside
      v1 .read/.write forms. 303 scopes advertised on the provider persona, 145 on the patient persona.
  - id: oauth2
    name: OAuth 2.0
    conforms: true
    evidence: >-
      grant_types_supported = [authorization_code, client_credentials]; response_types_supported = [code];
      token, authorize, revoke and introspection endpoints all published in smart-configuration.
  - id: oauth2-pkce
    name: OAuth 2.0 PKCE (RFC 7636)
    conforms: true
    evidence: code_challenge_methods_supported = [S256] in smart-configuration.
  - id: oidc
    name: OpenID Connect
    conforms: true
    evidence: >-
      smart-configuration capabilities include sso-openid-connect; `openid` and `fhirUser` scopes are

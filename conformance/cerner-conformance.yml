  - id: cors
    name: Cross-Origin Resource Sharing
    conforms: true
    evidence: CapabilityStatement.rest.security.cors = true on both open and secure endpoints.
  - id: json-patch
    name: JSON Patch (RFC 6902)
    conforms: true
    evidence: CapabilityStatement declares patchFormat and 8 resource types support the FHIR patch interaction.
  - id: idempotency-key
    name: HTTP Idempotency-Key header (draft-ietf-httpapi-idempotency-key)
    conforms: false
    evidence: >-
      No Idempotency-Key header is documented or advertised. Safe retry on writes is handled the FHIR way
      instead — version-aware update with If-Match/ETag, which the docs back with a documented 409 Conflict
      on an out-of-date version. See conventions/cerner-conventions.yml.
  - id: graphql
    name: GraphQL
    conforms: false
    evidence: >-
      No GraphQL endpoint is offered by Oracle Health or Millennium. The FHIR GraphQL capability is not
      declared in the CapabilityStatement.
  - id: asyncapi
    name: AsyncAPI / published event surface
    conforms: false
    evidence: >-
      No webhooks, FHIR Subscription resource or event catalog is declared in the CapabilityStatement or
      published in the Millennium Platform API documentation. The event-driven surface Oracle Health does
      operate is HL7 v2 messaging through Cerner Open Interface and CareAware, which is an interface-engine
      integration rather than a public developer event API.
  - id: mcp
    name: Model Context Protocol
    conforms: false
    evidence: No first-party MCP server. See mcp/cerner-mcp.yml.
  - id: a2a
    name: A2A Agent Card
    conforms: false
    evidence: >-
      /.well-known/agent-card.json and /.well-known/agent.json probed on every cerner.com and oracle.com

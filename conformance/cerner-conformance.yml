  - id: us-core
    name: HL7 US Core Implementation Guide
    conforms: true
    evidence: >-
      CapabilityStatement.instantiates includes
      http://hl7.org/fhir/us/core/CapabilityStatement/us-core-server — the server declares itself an
      instance of the US Core server capability statement. 23 resource types additionally carry

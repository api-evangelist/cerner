      us-core-observation-lab, us-core-medicationrequest, us-core-documentreference and others).
  - id: uscdi
    name: USCDI data classes
    conforms: true
    evidence: >-
      Delivered through the US Core profiles above. Oracle Health returns DataAbsentReason (valueCode
      "unknown") when an HL7 profile field is missing rather than omitting it —
      https://docs.oracle.com/en/industries/health/millennium-platform-apis/mfrap/r4_overview.html
  - id: smart-health-cards
    name: SMART Health Cards
    conforms: true
    evidence: >-

  - id: smart-backend-services
    name: SMART Backend Services Authorization
    conforms: true
    evidence: >-
      client_credentials grant + private_key_jwt with RS384/ES384 + 103 system/ scopes advertised — the
      complete SMART Backend Services profile.
  - id: rfc7009-token-revocation
    name: OAuth 2.0 Token Revocation (RFC 7009)
    conforms: true
    evidence: revocation_endpoint published in smart-configuration.
  - id: rfc7662-token-introspection
    name: OAuth 2.0 Token Introspection (RFC 7662)
    conforms: true
    evidence: introspection_endpoint https://authorization.cerner.com/tokeninfo published in smart-configuration.
  - id: rfc8615-well-known
    name: Well-Known URIs (RFC 8615)
    conforms: partial
    evidence: >-
      /.well-known/smart-configuration is served — but only relative to the per-tenant FHIR service root,

  - id: fhir-named-operations
    name: FHIR named operations ($-operations)
    conforms: true
    evidence: >-
      Six named operations declared in the CapabilityStatement: Group $export, ChargeItem $credit and
      $modify, DocumentReference $docref (USCoreFetchDocumentReferences), Patient $health-cards-issue,
      Binary autogen-ccd-if (CCD generation), Organization get-cg-for-mrcu. Each carries a resolvable
      OperationDefinition URL.
  - id: onc-cehrt
    name: ONC Certified EHR Technology (CEHRT) certified API criteria
    conforms: true
    evidence: >-
      Millennium is ONC-certified health IT; the open, unauthenticated read-only endpoint at

      properties:
        resourceType:
          type: string
        id:
          type: string
        meta:
          type: object
          additionalProperties: true
      required:
      - resourceType
      additionalProperties: true
    Bundle:
      type: object
      description: 'A FHIR R4 Bundle. Search results are returned as `type: searchset`; paging is carried on `link[relation=next]`.'
      properties:
        resourceType:
          const: Bundle
        type:
          type: string
        total:
          type: integer
        link:
          type: array
          items:
            type: object
            properties:
              relation:
                type: string
                examples:
                - self
                - next
                - previous
              url:
                type: string
                format: uri
        entry:
          type: array
          items:
            type: object
            additionalProperties: true
      required:
      - resourceType
      - type
      additionalProperties: true
    OperationOutcome:
      type: object
      description: FHIR R4 OperationOutcome — the error envelope for every non-2xx response.
      properties:
        resourceType:
          const: OperationOutcome
        issue:
          type: array
          items:
            type: object
            properties:

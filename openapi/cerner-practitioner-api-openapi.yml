openapi: 3.2.0
info:
  title: Oracle Health Millennium Platform FHIR R4 Practitioner API
  version: 4.0.1
  summary: HL7 FHIR R4 API for Oracle Health Millennium Platform (formerly Cerner Millennium).
  description: 'REST surface of the Oracle Health Millennium Platform FHIR R4 API, derived operation-for-operation from the CapabilityStatement Oracle Health serves at `/metadata` on the secure sandbox tenant, and from the SMART on FHIR discovery document served at `/.well-known/smart-configuration`. Every path, interaction, search parameter and OAuth scope in this document is present in one of those two provider-served resources; nothing was authored by hand. Millennium is multi-tenant: the tenant id is a required path segment of the service root, so the server variable `{tenant}` must be bound before any call. The open endpoint (`fhir-open.cerner.com`) is read-only and unauthenticated; the secure endpoints require SMART on FHIR OAuth 2.0.'
  contact:
    name: Oracle Health Developer Program
    url: https://www.oracle.com/health/developer/
  x-derived-from:
    capability_statement: https://fhir-ehr-code.cerner.com/r4/ec2458f2-1e24-41c8-b71b-0e701af7583d/metadata
    smart_configuration: https://fhir-ehr-code.cerner.com/r4/ec2458f2-1e24-41c8-b71b-0e701af7583d/.well-known/smart-configuration
    fetched: '2026-08-14'
  x-fhir-instantiates:
  - http://hl7.org/fhir/us/core/CapabilityStatement/us-core-server
  - http://hl7.org/fhir/uv/bulkdata/CapabilityStatement/bulk-data
  x-fhir-patch-formats:
  - application/json-patch+json
servers:
- url: https://fhir-ehr-code.cerner.com/r4/{tenant}
  description: Secure endpoint for provider / non-patient personas (also the secure sandbox).
  variables:
    tenant:
      default: ec2458f2-1e24-41c8-b71b-0e701af7583d
      description: Millennium tenant id. The sandbox default is the Oracle Health public sandbox tenant.
- url: https://fhir-myrecord.cerner.com/r4/{tenant}
  description: Secure endpoint for patient-access personas.
  variables:
    tenant:
      default: ec2458f2-1e24-41c8-b71b-0e701af7583d
      description: Millennium tenant id.
- url: https://fhir-open.cerner.com/r4/{tenant}
  description: Open, unauthenticated, read-only endpoint.
  variables:
    tenant:
      default: ec2458f2-1e24-41c8-b71b-0e701af7583d
      description: Millennium tenant id.
security:
- smartOnFhir: []
tags:
- name: Practitioner
  description: FHIR R4 Practitioner resource as implemented by Oracle Health Millennium Platform.
paths:
  /Practitioner:
    get:
      operationId: searchPractitioner
      summary: Search Practitioner
      description: FHIR R4 `search-type` interaction for Practitioner. Returns a searchset Bundle. Follow `Bundle.link[relation=next]` for pagination rather than constructing page URLs.
      tags:
      - Practitioner
      parameters:
      - name: _id
        in: query
        required: false
        schema:
          type: string
        description: A single or comma separated list of Practitioner ids. Either the '_id', 'identifier', 'name', 'active' or 'family' parameter, or a combination of 'given' and 'family' parameters must be provided.
        x-fhir-search-parameter: http://hl7.org/fhir/R4/SearchParameter/Resource-id
        x-fhir-search-type: token
      - name: identifier
        in: query
        required: false
        schema:
          type: string
        description: A practitioner's Identifier. Either the '_id', 'identifier', 'name', 'active' or 'family' parameter, or a combination of 'given' and 'family' parameters must be provided.
        x-fhir-search-parameter: http://hl7.org/fhir/us/core/SearchParameter/us-core-practitioner-identifier
        x-fhir-search-type: token
      - name: given
        in: query
        required: false
        schema:
          type: string
        description: The beginning of the given name of the practitioner. Either the '_id', 'identifier', 'name', 'active' or 'family' parameter, or a combination of 'given' and 'family' parameters must be provided.
        x-fhir-search-parameter: http://hl7.org/fhir/R4/SearchParameter/individual-given
        x-fhir-search-type: string
      - name: family
        in: query
        required: false
        schema:
          type: string
        description: The beginning of the family name of the practitioner. Either the '_id', 'identifier', 'name', 'active' or 'family' parameter, or a combination of 'given' and 'family' parameters must be provided.
        x-fhir-search-parameter: http://hl7.org/fhir/R4/SearchParameter/individual-family
        x-fhir-search-type: string
      - name: name
        in: query
        required: false
        schema:
          type: string
        description: The beginning of the first, last or middle name of the practitioner. Either the '_id', 'identifier', 'name', 'active' or 'family' parameter, or a combination of 'given' and 'family' parameters must be provided.
        x-fhir-search-parameter: http://hl7.org/fhir/R4/SearchParameter/individual-name
        x-fhir-search-type: string
      - name: active
        in: query
        required: false
        schema:
          type: string
        description: Whether the practitioner record is active. Either the '_id', 'identifier', 'name', 'active' or 'family' parameter, or a combination of 'given' and 'family' parameters must be provided.
        x-fhir-search-parameter: http://hl7.org/fhir/R4/SearchParameter/Resource-active
        x-fhir-search-type: token
      - name: _count
        in: query
        required: false
        schema:
          type: number
        description: The maximum number of results to return in a page. Not honored when '_id' is set. Either the '_id', 'identifier', 'name', 'active' or 'family' parameter, or a combination of 'given' and 'family' parameters must be provided.
        x-fhir-search-parameter: http://hl7.org/fhir/R4/SearchParameter/Resource-count
        x-fhir-search-type: number
      responses:
        '200':
          description: A FHIR searchset Bundle of Practitioner resources.
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/Bundle'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '406':
          $ref: '#/components/responses/Error406'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
      x-fhir-supported-profile:
      - http://hl7.org/fhir/us/core/StructureDefinition/us-core-practitioner
    post:
      operationId: createPractitioner
      summary: Create Practitioner
      description: FHIR R4 `create` interaction for Practitioner.
      tags:
      - Practitioner
      requestBody:
        required: true
        content:
          application/fhir+json:
            schema:
              $ref: '#/components/schemas/Resource'
      responses:
        '201':
          description: Practitioner created. The `Location` header carries the new resource URL.
          headers:
            Location:
              description: URL of the created resource.
              schema:
                type: string
            ETag:
              description: Version identifier of the created resource.
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '406':
          $ref: '#/components/responses/Error406'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
      x-fhir-supported-profile:
      - http://hl7.org/fhir/us/core/StructureDefinition/us-core-practitioner
  /Practitioner/{id}:
    parameters:
    - name: id
      in: path
      required: true
      description: Logical id of the Practitioner resource.
      schema:
        type: string
    get:
      operationId: readPractitioner
      summary: Read Practitioner
      description: FHIR R4 `read` interaction for Practitioner.
      tags:
      - Practitioner
      responses:
        '200':
          description: The requested Practitioner resource.
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/Resource'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '406':
          $ref: '#/components/responses/Error406'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
      x-fhir-supported-profile:
      - http://hl7.org/fhir/us/core/StructureDefinition/us-core-practitioner
components:
  schemas:
    Bundle:
      type: object
      description: 'A FHIR R4 Bundle. Search results are returned as `type: searchset`; paging is carried on `link[relation=next]`.'
      properties:
        resourceType:
          const: Bundle
        type:
          type: string
        total:
          type: integer
        link:
          type: array
          items:
            type: object
            properties:
              relation:
                type: string
                examples:
                - self
                - next
                - previous
              url:
                type: string
                format: uri
        entry:
          type: array
          items:
            type: object
            additionalProperties: true
      required:
      - resourceType
      - type
      additionalProperties: true
    OperationOutcome:
      type: object
      description: FHIR R4 OperationOutcome — the error envelope for every non-2xx response.
      properties:
        resourceType:
          const: OperationOutcome
        issue:
          type: array
          items:
            type: object
            properties:
              severity:
                type: string
                examples:
                - fatal
                - error
                - warning
                - information
              code:
                type: string
                examples:
                - required
                - business-rule
                - extension
                - not-supported
              location:
                type: array
                items:
                  type: string
              diagnostics:
                type: string
      required:
      - resourceType
      - issue
      additionalProperties: true
    Resource:
      type: object
      description: A FHIR R4 resource. The wire format is `application/fhir+json`; element-level schemas are defined by HL7 FHIR R4 (4.0.1), not by this document.
      properties:
        resourceType:
          type: string
        id:
          type: string
        meta:
          type: object
          additionalProperties: true
      required:
      - resourceType
      additionalProperties: true
  responses:
    Error422:
      description: Unprocessable Entity — syntactically valid JSON that violates a business rule, carries unsupported fields, modifier extensions, or implicit rules.
      content:
        application/fhir+json:
          schema:
            $ref: '#/components/schemas/OperationOutcome'
    Error406:
      description: 'Not Acceptable — a non-JSON media type was requested. Returned with `Content-Length: 0`.'
    Error404:
      description: Not Found — the resource does not exist.
      content:
        application/fhir+json:
          schema:
            $ref: '#/components/schemas/OperationOutcome'
    Error403:
      description: Forbidden — unknown instance or the caller is not authorized for this tenant ("Tenant not valid or accessible").
      content:
        application/fhir+json:
          schema:
            $ref: '#/components/schemas/OperationOutcome'
    Error401:
      description: Unauthorized — no valid credentials were supplied to a secure endpoint.
      content:
        application/fhir+json:
          schema:
            $ref: '#/components/schemas/OperationOutcome'
    Error400:
      description: Bad Request — a required search parameter was omitted. The server responds "No supported search parameters provided".
      content:
        application/fhir+json:
          schema:
            $ref: '#/components/schemas/OperationOutcome'
    Error500:
      description: Internal Server Error — including a response that is missing a field FHIR requires (OperationOutcome severity `fatal`, code `required`).
      content:
        application/fhir+json:
          schema:
            $ref: '#/components/schemas/OperationOutcome'
  securitySchemes:
    smartOnFhir:
      type: oauth2
      description: 'SMART on FHIR OAuth 2.0. Endpoints are tenant-scoped and are discovered per tenant from `/.well-known/smart-configuration`. Client authentication methods advertised by the server: client_secret_basic, private_key_jwt. PKCE methods: S256.'
      flows:
        authorizationCode:
          authorizationUrl: https://authorization.cerner.com/tenants/{tenant}/protocols/oauth2/profiles/smart-v1/personas/provider/authorize
          tokenUrl: https://authorization.cerner.com/tenants/{tenant}/hosts/fhir-ehr-code.cerner.com/protocols/oauth2/profiles/smart-v1/token
          refreshUrl: https://authorization.cerner.com/tenants/{tenant}/hosts/fhir-ehr-code.cerner.com/protocols/oauth2/profiles/smart-v1/token
          scopes:
            fhirUser: Identity of the authorizing FHIR user.
            launch: EHR launch context.
            offline_access: Refresh token that survives the user session.
            online_access: Refresh token bound to the user session.

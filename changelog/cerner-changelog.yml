note: >-
  Oracle Health publishes no dated changelog for the Millennium Platform APIs on any anonymously readable
  page. /whats-new.html and /release-notes.html both 404 under the millennium-platform-apis doc tree, and
  the doc index offers no changelog, release-notes or "what's new" section. Sibling Oracle Health products
  (Connection Hub, Patient Portal) DO publish dated release notes in the same Help Center, which makes the
  absence here a choice rather than a platform limitation. Change announcements that do exist — the FHIR
  DSTU 2 end-of-support notice is the live example — are posted to the Oracle Health Developer Forums,
  which returns 403 to an anonymous client, so an integrator cannot subscribe to platform change without
  an account.

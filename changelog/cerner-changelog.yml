machine_readable_change_signal:
  available: true
  source: https://fhir-ehr-code.cerner.com/r4/{tenant}/metadata
  field: CapabilityStatement.date
  observed: '2026-08-14'
  detail: >-
    The one change signal an integrator CAN read without an account is the CapabilityStatement itself. It
    carries a `date`, and the served document is regenerated — the value observed on 2026-08-14 was that
    day's date. Diffing /metadata between runs is the only reliable way to detect that a resource,
    interaction, search parameter, profile or named operation changed on a tenant. This repo keeps a dated
    capture at conformance/cerner-capability-statement-r4-secure.json to make that diff possible.

description: >-
  Oracle Health publishes NO public plans or pricing for the Millennium Platform APIs. There is no
  self-serve tier list, no per-call price, and no published quota. This file records that absence with
  evidence.
note: >-
  This artifact previously carried a scaffold of invented Free / Professional / Enterprise tiers with
  invented request quotas and rate limits, written by a 2026-05-04 bulk sweep. None of it came from Oracle
  Health and all of it has been removed. What is true is recorded below instead.
findings:
  - fact: There is no public pricing page for the Millennium Platform APIs.
    evidence:
      - url: https://www.oracle.com/health/developer/
        status: 200
        note: Developer program landing page. No pricing, no tiers, no fee schedule.
      - url: https://www.oracle.com/health/developer/program/
        status: 200
        note: Program page. No pricing.
  - fact: >-
      The one page Oracle names as covering fees — "API Access and Fees for Registering an App" — is not
      publicly readable.
    evidence:
      - url: https://wiki.cerner.com/x/Ta9W1
        status: 403
        note: >-
          Linked from the Millennium Platform APIs Get Started page. wiki.cerner.com returns 403 to any
          anonymous client, so the fee schedule cannot be read without an account.
  - fact: >-
      Access is mediated by the health system, not bought by the developer. A third-party app is
      registered with Oracle Health and then provisioned by each customer health system for its own
      tenant; commercial terms sit in that relationship rather than in a published price list.
    evidence:
      - url: https://docs.oracle.com/en/industries/health/millennium-platform-apis/index.html
        status: 200
        note: >-
          Get Started routes app registration through SMART Application Provisioning and Multi-Tenant
          Domains, both on wiki.cerner.com (403).
  - fact: >-
      One surface is genuinely free and needs no account at all — the open, read-only FHIR endpoint at
      https://fhir-open.cerner.com/r4/{tenant}, which serves the sandbox tenant anonymously. It is an ONC
      certification obligation rather than a commercial plan, so it is not modelled as a tier.
    evidence:
      - url: https://fhir-open.cerner.com/r4/ec2458f2-1e24-41c8-b71b-0e701af7583d/metadata
        status: 200

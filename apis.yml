  description: 'The full HL7 FHIR R4 REST surface of Oracle Health Millennium — 44 resource types, 123 operations, derived operation-for-operation from the CapabilityStatement Oracle Health serves at /metadata and the SMART discovery document it serves at /.well-known/smart-configuration. Multi-tenant: the tenant id is a required path segment of the service root. Read on 42 resource types, search on 37, create on 19, patch on 8, update on 7, delete on 1, plus system-level batch and six named FHIR operations.'

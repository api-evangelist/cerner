# ─────────────────────────────────────────────────
# Shared / Backbone types
# ─────────────────────────────────────────────────

type Coding {
  system: URI
  version: String
  code: Code
  display: String
  userSelected: Boolean
}

type CodeableConcept {
  coding: [Coding!]
  text: String
}

type Identifier {
  use: Code
  type: CodeableConcept
  system: URI
  value: String
  period: Period
  assigner: Reference
}

type Reference {
  reference: String
  type: URI
  identifier: Identifier
  display: String
}

type Period {
  start: DateTime
  end: DateTime
}

type Quantity {
  value: Decimal
  comparator: Code
  unit: String
  system: URI
  code: Code
}

type Range {
  low: Quantity
  high: Quantity
}

type Ratio {
  numerator: Quantity
  denominator: Quantity
}

type HumanName {
  use: Code
  text: String
  family: String
  given: [String!]
  prefix: [String!]
  suffix: [String!]
  period: Period
}

type Address {
  use: Code
  type: Code
  text: String
  line: [String!]
  city: String
  district: String
  state: String
  postalCode: String
  country: String
  period: Period
}

type ContactPoint {
  system: Code
  value: String
  use: Code
  rank: PositiveInt
  period: Period
}

type Attachment {
  contentType: Code
  language: Code
  data: Base64Binary
  url: URL
  size: UnsignedInt
  hash: Base64Binary
  title: String
  creation: DateTime
}

type Extension {
  url: URI!
  valueString: String
  valueBoolean: Boolean
  valueCode: Code
  valueDateTime: DateTime
  valueCoding: Coding
  valueCodeableConcept: CodeableConcept
  valueReference: Reference
  valueQuantity: Quantity
  valueInteger: Int
}

type Meta {
  versionId: ID
  lastUpdated: Instant
  source: URI
  profile: [Canonical!]
  security: [Coding!]
  tag: [Coding!]
}

type Narrative {
  status: Code!
  div: String!
}

type Annotation {
  authorReference: Reference
  authorString: String
  time: DateTime
  text: Markdown!
}

type Timing {
  event: [DateTime!]
  code: CodeableConcept
}

type Dosage {
  sequence: Int
  text: String
  additionalInstruction: [CodeableConcept!]
  patientInstruction: String
  timing: Timing
  asNeededBoolean: Boolean
  asNeededCodeableConcept: CodeableConcept
  site: CodeableConcept
  route: CodeableConcept
  method: CodeableConcept

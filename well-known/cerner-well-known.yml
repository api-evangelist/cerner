source: live GET of /.well-known/* on every apis.yml host, every OpenAPI servers[] host, and every FHIR service root
note: >-
  Oracle Health serves a real, machine-readable discovery surface — but NOT at the host root. Millennium
  is multi-tenant, so the tenant id is a path segment of the FHIR service root, and RFC 8615 discovery is
  served relative to that service root (per SMART App Launch), e.g.
  https://fhir-ehr.cerner.com/r4/{tenant}/.well-known/smart-configuration. The host roots
  (fhir-ehr.cerner.com, fhir-open.cerner.com, fhir-ehr-code.cerner.com) answer 502 for every /.well-known/*
  path because they cannot route without a tenant, and www.cerner.com / code.cerner.com / fhir.cerner.com
  answer a soft 200 (an HTML 404 page or a redirect to an Oracle marketing page) for every path — those are
  recorded below as misses, not hits. No security.txt, api-catalog, ai-plugin.json or agent card is served
  anywhere on the estate.
hosts:
  - host: https://fhir-ehr.cerner.com/r4/{tenant}
    role: production FHIR service root, provider persona
  - host: https://fhir-ehr-code.cerner.com/r4/{tenant}
    role: secure sandbox FHIR service root, provider persona
  - host: https://fhir-myrecord.cerner.com/r4/{tenant}
    role: secure FHIR service root, patient-access persona
  - host: https://fhir-open.cerner.com/r4/{tenant}
    role: open, unauthenticated, read-only FHIR service root
  - host: https://authorization.cerner.com
    role: SMART on FHIR authorization server
